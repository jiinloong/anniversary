<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8eee6">
  <title>A Little Scrapbook for You ♡</title>
  <style>
    :root {
      --paper: #fffaf2;
      --paper-deep: #f6e8d9;
      --ink: #55443f;
      --muted: #8a7169;
      --rose: #d88e91;
      --rose-dark: #a95766;
      --sage: #a9b8a0;
      --line: #e8d6c8;
      --shadow: 0 12px 30px rgba(104, 69, 57, .10);
    }
* { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(216,142,145,.12) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 35%, rgba(169,184,160,.15) 0 2px, transparent 3px),
        #f4e9df;
      background-size: 26px 26px, 32px 32px, auto;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(900px, calc(100% - 28px)); margin: 22px auto 50px; }
    .paper {
      position: relative;
      padding: clamp(20px, 5vw, 48px);
      background: var(--paper);
      border: 1px solid #ead8c9;
      box-shadow: var(--shadow);
      border-radius: 4px;
      overflow: hidden;
    }
    .paper:before {
      content: ""; position: absolute; inset: 10px;
      border: 1px dashed #e6cfc0; pointer-events: none; border-radius: 2px;
    }
    .tape {
      position: absolute; top: 7px; left: 50%; transform: translateX(-50%) rotate(-2deg);
      width: 112px; height: 24px; background: rgba(216,142,145,.35);
      border-left: 1px dashed rgba(169,87,102,.3); border-right: 1px dashed rgba(169,87,102,.3);
    }
    .eyebrow { text-transform: uppercase; letter-spacing: .18em; font: 700 .72rem Arial, sans-serif; color: var(--rose-dark); }
    h1 { font-size: clamp(2.1rem, 7vw, 4rem); line-height: 1.04; font-weight: 500; margin: 10px 0 14px; }
    h2 { font-weight: 500; line-height: 1.15; font-size: clamp(1.55rem, 4vw, 2.15rem); margin: 8px 0 12px; }
    h3 { font-weight: 500; margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 8px 0 14px; }
    .center { text-align: center; }
    .subtitle { color: var(--muted); max-width: 560px; margin: 0 auto 22px; }
    .heart { color: var(--rose-dark); font-size: 1.25rem; }
    .sticker { display: inline-block; background: #e7eee1; padding: 5px 12px; border-radius: 4px; transform: rotate(-2deg); font-size: .88rem; }
    .section { margin-top: 28px; }
    .panel { border: 1px solid var(--line); background: rgba(255,255,255,.55); border-radius: 8px; padding: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin: 14px 0; }
    .btn {
      border: 1px solid #bd777f; background: var(--rose); color: #fffaf6;
      border-radius: 24px; padding: 10px 17px; box-shadow: 0 3px 0 rgba(120,67,72,.13);
    }
    .btn:hover { filter: brightness(.97); transform: translateY(-1px); }
    .btn.secondary { background: #fffaf2; color: var(--rose-dark); }
    .btn.sage { background: #71856b; border-color: #71856b; }
    .manual { display: flex; gap: 8px; max-width: 460px; margin: 10px auto 0; }
    .manual input { min-width: 0; flex: 1; border: 1px solid #d9c5b7; border-radius: 8px; padding: 11px 12px; background: #fffdf8; color: var(--ink); }
    .status { min-height: 1.5em; color: var(--muted); font-size: .92rem; text-align: center; }
    video { display: none; width: 100%; max-height: 360px; object-fit: cover; background: #2b2524; border-radius: 10px; margin-top: 12px; }
    .gift-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .gift-tile { padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf8; }
    .gift-number { font: 700 .72rem Arial, sans-serif; letter-spacing: .14em; color: var(--rose-dark); }
    .gift-tile p { color: var(--muted); font-size: .94rem; }
    .reveal { display: none; margin-top: 22px; animation: appear .35s ease-out; }
    .reveal.visible { display: block; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .reveal-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    .photo-wrap { position: relative; padding: 10px 10px 24px; background: white; box-shadow: 0 5px 15px #6b4a3c1c; transform: rotate(-1deg); }
    .photo-wrap img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--paper-deep); }
    .photo-caption { text-align: center; font-size: .82rem; color: var(--muted); margin-top: 7px; }
    .letter { padding: 18px; background: #fff7e9; border-left: 3px solid var(--rose); white-space: pre-line; }
    .tag { display: inline-block; color: #65775d; background: #e9efe4; border-radius: 3px; padding: 4px 9px; font-size: .82rem; margin-bottom: 9px; }
    details { margin-top: 25px; border-top: 1px dashed var(--line); padding-top: 15px; }
    summary { cursor: pointer; color: var(--rose-dark); }
    .barcode-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
    .barcode-card { background: white; border: 1px solid var(--line); padding: 10px; text-align: center; break-inside: avoid; }
    .barcode-card svg { width: 100%; height: auto; }
    .barcode-card strong { display: block; font: 700 .82rem Arial, sans-serif; margin-top: 4px; }
    .tiny { font: .8rem Arial, sans-serif; color: var(--muted); }
    .footer { text-align: center; color: var(--muted); font-size: .86rem; margin: 18px 0 0; }
    .hidden { display: none !important; }
    @media (max-width: 620px) {
      .page { width: calc(100% - 16px); margin-top: 12px; }
      .paper { padding: 30px 19px; }
      .gift-grid, .reveal-layout, .barcode-grid { grid-template-columns: 1fr; }
      .manual { flex-direction: column; }
      .manual .btn { width: 100%; }
      .tape { top: 4px; }
    }
